# uxon host config. Full guide: docs/index.md
# (https://github.com/vzd3v/uxon/blob/main/docs/index.md).
#
# ── Recommended workflow ──────────────────────────────────────────
# Pair each shell user with a low-privilege OS account that owns
# the agent's runtime — e.g. `wes` (you) + `wes-agent`. The agent
# runs as `<user>-agent` via `sudo -iu`. With `--mode yolo`, the
# blast radius of a runaway tool is `<user>-agent`'s sandbox, not
# your home directory or your team's filesystem. In team setups
# this also gives the operator supervision without impersonation —
# see docs/explain/supervision-without-impersonation.md.
#
# This file ships in the SIMPLEST mode (agent runs as the caller),
# so it copies and runs without any extra OS setup. To switch to
# the recommended paired sandbox, read
# docs/scenarios/solo-1.md (or the relevant team
# section) and replace the active block with the snippet shown
# there. Scenario blocks below are commented out as starting points.
#
# Scenarios:
#   - Solo on a single host    (active default)
#   - Solo on multiple hosts   → add [[remote_hosts]] aggregation
#   - Team on a single host    → per-caller paired sandbox / shared sandbox
#   - Team on multiple hosts   → both
#
# Every key is documented in docs/reference/configuration.md.

default_launch_mode = "caller"
session_prefix      = "uxon-"

# The execution backend owns the complete target-user command boundary:
# tmux server/list/attach/kill, git/worktrees/filesystem, probes, runtime
# lifecycle, and agent launch. ``local`` is built in. A command backend is
# useful for a host namespace or another operator-owned isolation boundary.
# Drain all sessions for a backend before changing its definition. Changing
# a backend id selects a different default tmux socket.
#
# tmux_socket_template = "/tmp/uxon-{user}-{execution_backend}.sock"
# [execution]
# default_backend = "host_netns"
# state_dir = "/var/lib/uxon/execution-state"
# [execution.backend_by_launch_user]
# wes-agent = "host_netns"
# [execution.backends.host_netns]
# kind = "command"
# command_prefix = ["sudo", "-n", "/usr/local/libexec/uxon-exec", "{user}", "--"]
# probe_timeout_seconds = 5.0

# Required only for `uxon new <name>` (project scaffolding). Leave
# both unset to use just `uxon run` and the TUI's "New session in
# current folder" — those gate on write access and accept any
# writable directory.
# allowed_roots    = ["~/projects"]
# new_project_root = "~/projects"

[launch]
enabled_profiles = ["claude"]
default_profile = "claude"

[agents.claude]
default_args = []

# [agents.codex]
# default_args = []
#
# [agents.cursor]
# default_args = []


# ─── Solo on a single host (recommended: paired sandbox) ──────────
# docs/scenarios/solo-1.md
#
# One-time host setup:
#   sudo useradd -m -s /bin/bash wes-agent
#   echo 'wes ALL=(wes-agent) NOPASSWD: ALL' \
#     | sudo tee /etc/sudoers.d/uxon-wes-agent
#   sudo chmod 440 /etc/sudoers.d/uxon-wes-agent
#   sudo install -d -o wes-agent -g wes-agent /srv/projects
#
# Then replace the active "default_launch_mode = caller" line above
# with the block below:
#
# default_launch_mode = "fixed"
# default_launch_user        = "wes-agent"
# session_users       = ["wes-agent"]
# allowed_roots       = ["/srv/projects"]
# new_project_root    = "/srv/projects"


# ─── Solo on multiple hosts ───────────────────────────────────────
# docs/scenarios/solo-n.md
#
# Each peer runs its own uxon install with its own paired-sandbox
# config. On the aggregator, add one block per peer. Auth, port,
# ProxyJump etc. live in ~/.ssh/config — uxon does not duplicate them.
#
# [[remote_hosts]]
# name        = "gpu-box"
# ssh_alias   = "gpu-box"
# description = "leased GPU box"   # optional, shown in TUI tooltips
# remote_uxon = "uxon"         # optional, default "uxon"


# ─── Team on a single host ────────────────────────────────────────
# docs/scenarios/team-1.md
#
# Pick ONE of (a) / (b) / (c) below.
#
# (a) Recommended: per-caller paired sandbox.
#     One <user>-agent per developer.
#
# default_launch_mode   = "fixed"
# default_launch_user          = "team-agent"   # fallback for unmapped callers
# session_users         = ["nadia-agent", "liam-agent", "ethan-agent"]
# enable_all_users_list = true
# allowed_roots         = ["/srv/projects"]
# new_project_root      = "/srv/projects"
#
# [launch_user_by_caller]
# nadia  = "nadia-agent"
# liam   = "liam-agent"
# ethan  = "ethan-agent"
#
# (b) Shared sandbox user (one OS account for all agents).
#     Useful when the agent needs shared workspace/state across devs.
#
# default_launch_mode = "fixed"
# default_launch_user        = "team-agent"
# session_users       = ["team-agent"]
# allowed_roots       = ["/srv/projects"]
# new_project_root    = "/srv/projects"
#
# (c) No sandbox: each developer's agent runs as the developer.
#     Simplest; agent inherits the caller's trust boundary.
#
# default_launch_mode   = "caller"
# session_users         = ["nadia", "liam", "ethan"]
# enable_all_users_list = true


# ─── Team on multiple hosts ───────────────────────────────────────
# docs/scenarios/team-n.md
#
# Combine the team-on-a-single-host keys above with [[remote_hosts]]
# blocks like in the solo-on-multiple-hosts section.


# ─── Worktrees (uxon-managed, any agent) ──────────────────────────
# docs/guides/customise/worktrees.md
#
# `uxon run/new -w <branch>` creates and owns the worktree itself.
# ``worktree_root`` empty (default) places worktrees under
# `<repo>/.uxon/worktrees/<branch-slug>/` (auto-excluded via
# .git/info/exclude). When set, uxon uses
# `<worktree_root>/<repo-slug>/<branch-slug>/` — must be writable
# by the launch user and inside ``allowed_roots``.
# ``worktree_base`` picks the base ref for a NEW branch: ``local``
# (default) branches off local origin/HEAD (else HEAD) with no
# network; ``remote`` runs `git fetch origin` first (needs network
# + credentials).
#
# worktree_root = ""
# worktree_base = "local"


# ─── GitHub repo creation on `uxon new` ───────────────────────────
# docs/guides/customise/configure-github-on-new-project.md
#
# Off by default. ``git_create_enabled = true`` lets the new-project
# flow offer repo creation, restricted to the profile whitelist
# below — no owner outside the array is reachable. ``auth = "gh"``
# shells out to `gh repo create` under ``creds_user``; ``"token"``
# calls the REST API with a fine-grained PAT read from
# ``token_file`` (required for token auth; never logged).
#
# git_create_enabled = true
#
# [[git_remote_profiles]]
# name       = "work"
# host       = "github.com"
# owner      = "my-org"
# auth       = "gh"            # or "token" + token_file
# creds_user = "wes"           # defaults to launch user
# visibility = "private"
#
# [launch.profiles.claude]
# agent = "claude"
# allowed_git_remote_profiles = ["work"]
# default_git_remote_profile = "work"


# ─── Dashboard columns + view (TUI) ───────────────────────────────
# docs/guides/customise/customise-dashboard.md
#
# Empty / absent ``columns`` uses the built-in registry defaults.
# Listing columns explicitly opts into a fixed visual order;
# unknown ids from older / newer uxon versions are silently
# dropped. The ``path`` and ``cmd`` columns are hidden by default
# — opt back in by listing them here.
#
# ``default_view`` picks the initial dashboard layout. ``flat``
# (default) is a single ranked list across the fleet; ``by_host``
# shows a per-host tab strip and status bar. Toggle at runtime
# with ``v``. (The legacy ``default_sort_by`` key is silently
# ignored — sort is a fixed contract, see configuration.md.)
#
# [tui.table]
# columns      = ["name", "user", "cpu", "ram", "last"]
# default_view = "flat"


# ─── Dashboard search bar (TUI) ───────────────────────────────────
# docs/reference/configuration.md#tuisearch-table
#
# The bar takes focus on TUI mount; press ``s`` (or ``/``) to refocus
# from anywhere, ``Esc`` to clear-and-blur. ``fields`` controls which
# row attributes the query matches against (allowed values:
# ``name``, ``user``, ``host``, ``path``, ``cmd``). Unknown entries
# fail loud at load.
#
# [tui.search]
# fields = ["name", "user"]


# ─── Block colours (TUI) ──────────────────────────────────────────
# docs/guides/customise/customise-dashboard.md
#
# Each remote host gets a hue applied to its tab, status-bar name
# token, and rows. Pin a hue per peer with
# ``[[remote_hosts]] color = "..."`` (overrides auto-cycle); otherwise
# the TUI cycles through ``tui.color_palette``. Local rows take
# ``local_host.color``.
#
# [tui]
# color_palette = ["cyan", "blue"]
#
# [local_host]
# color = "green"


# ─── SSH multiplexing ─────────────────────────────────────────────
# docs/reference/configuration.md (top-level keys)
#
# ``ssh_multiplex`` toggles ``ControlMaster=auto`` /
# ``ControlPath`` / ``ControlPersist`` on the default fetch template
# (warm tick: 5–20 ms vs cold 200–500 ms). Set ``"off"`` only in
# environments that prohibit ControlPersist sockets.
# ``ssh_control_persist_seconds`` is the master's lifetime; must be
# ``> 0``. To disable multiplexing entirely set
# ``ssh_multiplex = "off"`` rather than zeroing this out.
#
# ssh_multiplex                = "auto"
# ssh_control_persist_seconds  = 300


# ─── Refresh cadence + fetch concurrency ──────────────────────────
# docs/guides/customise/tune-refresh-cadence.md
#
# ``tui_refresh_interval_seconds`` paces the local tmux poll;
# ``tui_ssh_refresh_interval_seconds`` paces SSH-driven streams
# (per-peer pollers; a peer's ``interval`` overrides it).
# ``fetch_concurrency`` caps concurrent SSH fetch workers
# fleet-wide so a large fleet recovering from an outage doesn't
# exhaust file descriptors. Not on the TUI settings screen — edit
# here.
#
# tui_refresh_interval_seconds     = 2.0
# tui_ssh_refresh_interval_seconds = 10.0
# fetch_concurrency                = 16


# ─── uxon-managed tmux options ────────────────────────────────────
# docs/reference/configuration.md ([tmux] managed options)
#
# OFF BY DEFAULT. When enabled, uxon layers the recommended set below
# (mouse support, OSC-52 passthrough, extended keys, terminal-features
# for agent TUIs) on top of whatever the launch user's own tmux config
# (/etc/tmux.conf, ~/.tmux.conf, XDG) provides, at launch, without
# editing anyone's files. The recommended tables ship built-in, so the
# block below is shown only so you can see what gets applied — to turn
# it on you only need ``manage_options = true`` (the scope tables are
# optional; uncomment them only to customise).
#
# The three tables map 1:1 to tmux scopes and are emitted in this fixed
# order: global (``set -g``) → server (``set -s``) → append-server
# (``set -as``). Within a table, declaration order is preserved. Values
# are passed to tmux VERBATIM (no validation): a bad option aborts the
# launch (fail-fast) — uxon never starts a session whose options failed.
#
# To enable, uncomment ``[tmux]`` with ``manage_options = true``. Override
# is per-scope: writing e.g. [tmux.options] replaces only that scope
# (re-list every global option you want); scopes you omit keep their
# recommended defaults.
#
# [tmux]
# manage_options = true
#
# [tmux.options]            # set -g
# mouse = "on"
# allow-passthrough = "on"
#
# [tmux.server_options]     # set -s
# extended-keys = "on"
#
# [tmux.append_server_options]   # set -as
# terminal-features = "xterm*:extkeys"


# ─── Audit channel ────────────────────────────────────────────────
# docs/reference/audit-events.md · docs/privacy.md
#
# ON BY DEFAULT. Every uxon invocation emits structured events to
# journald (preferred) or /dev/log (fallback). ``enabled = false``
# is the only kill-switch — there is no environment-variable
# override. ``syslog_facility`` applies only on the /dev/log
# fallback path (journald carries its own metadata).
#
# [audit]
# enabled         = true
# syslog_facility = "user"


# ─── Workload runtimes ───────────────────────────────────────────
# docs/reference/configuration.md ([runtimes.<id>])
#
# A launch uses an isolated workload only when its launch profile names a
# non-direct ``runtime``. uxon models no engine-specific semantics: every
# command below is an argv LIST you supply verbatim — never a shell
# string. ``{resource}`` is the resolved workload name; ``{runtime_dir}``
# is the working directory after ``path_map``.
#
# The resource is chosen deterministically per (launch user, project
# directory) — the same resource is reused across sessions, never one
# per session.
#
# ``on_missing`` gates what uxon may do when the resource is not
# running: ``fail`` (default) execs only — a stopped/absent resource
# fails with an actionable message; ``start`` also starts a stopped
# one; ``create`` also creates an absent one. uxon NEVER stops or
# removes the resource itself — only ``stop_command`` (below)
# terminates the agent process. ``approval`` is ``prompt``
# (the TUI shows a confirm before any start/create) or ``auto`` (act
# without asking, when permitted). The CLI is non-interactive and
# always acts auto-if-permitted.
#
# Probe semantics matter: ``ready_command`` must exit 0 only when the
# workload is ready. ``exists_command`` exits 0 when it exists.
#
# Teardown is the mirror of the exec wrap. ``tmux kill-session`` may only
# sever the client-side exec, so uxon records the workload PID in
# ``{pidfile}`` and can run ``stop_command`` to terminate that process.
# Omit ``stop_command`` when the runtime guarantees normal process cleanup;
# otherwise the agent may orphan and uxon
# prints a reminder at every kill).
#
# [launch.profiles.claude_container]
# agent = "claude"
# runtime = "workbox"
#
# [runtimes.workbox]
# kind = "command"
# resource_scope = "per_user"   # global | per_user
# resource_name_template = "uxon-{user}-{launch_profile}-{project_slug}"
# exec_prefix = ["docker", "exec", "-w", "{runtime_dir}", "-i", "{resource}"]
# telemetry = "cgroup"          # none | cgroup
#
# [runtimes.workbox.readiness]
# on_missing = "fail"           # fail | start | create
# approval = "prompt"           # prompt | auto
# ready_command = ["docker", "top", "{resource}"]
# exists_command = ["docker", "container", "inspect", "{resource}"]
# start_command = ["docker", "start", "{resource}"]
# create_command = ["docker", "compose", "up", "-d"]
#
# [runtimes.workbox.identity]
# resolve_command = ["docker", "inspect", "--format", '{"id":"{{.Id}}","host_pid":{{.State.Pid}},"epoch":"{{.State.StartedAt}}"}', "{resource}"]
#
# [runtimes.workbox.session]
# # Reap this session's agent on kill ({pidfile} is uxon-supplied,
# # unique per session); the resource itself is left running:
# stop_command = ["docker", "exec", "{resource}", "sh", "-c", "kill $(cat {pidfile}) 2>/dev/null; rm -f {pidfile}"]
#
# [runtimes.workbox.timeouts]
# probe_seconds = 10.0
# prepare_seconds = 120.0
# stop_seconds = 10.0
#
# Translate the host working directory to a container path (longest
# matching host prefix wins; no match → host path verbatim):
#
# [runtimes.workbox.path_map]
# "/srv/projects" = "/work"
